services:
  # ── Backend Web Service (Django + Gunicorn) ───────────────────
  - type: web
    name: csms-backend
    runtime: python
    rootDir: Car_Management_system/backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin"
    startCommand: "gunicorn car_management.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: csms-db
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── Frontend Static Site (React 19 + Vite 8) ──────────────────
  - type: web
    name: csms-frontend
    runtime: static
    rootDir: Car_Management_system/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: csms-backend
          envVarKey: RENDER_EXTERNAL_URL
          value: "${RENDER_EXTERNAL_URL}/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Managed PostgreSQL Database ───────────────────────────────
databases:
  - name: csms-db
    plan: free
    databaseName: csms_db
    user: csms_user

